services:
  database:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: symfoconnect_db
    ports:
      - "6033:3306"
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin-symfoconnect:
    image: phpmyadmin:apache
    container_name: phpmyadmin-symfoconnect
    links:
      - database
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    restart: always
    ports:
      - "8081:80"

  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"

volumes:
  dbdata:
